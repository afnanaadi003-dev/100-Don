<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>100 Politician Profiles — 100-Don</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #070b18; --card: rgba(22, 28, 46, 0.55); --border: rgba(212, 160, 23, 0.28);
    --text: #f2ead8; --muted: #9aa3b8; --gold: #f0c94a; --gold2: #d4a017; --accent: #7ce7d2;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text);
    overflow-x: hidden;
  }
  /* dreamy aurora backdrop */
  body::before, body::after {
    content: ""; position: fixed; z-index: -2; width: 60vw; height: 60vw; border-radius: 50%;
    filter: blur(90px); opacity: .35; pointer-events: none;
  }
  body::before { background: radial-gradient(circle, #3b2f7a 0%, transparent 65%); top: -18vw; left: -15vw; animation: drift 26s ease-in-out infinite alternate; }
  body::after  { background: radial-gradient(circle, rgba(212,160,23,.55) 0%, transparent 65%); bottom: -25vw; right: -18vw; animation: drift 32s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(6vw, 4vw) scale(1.15); } }
  .stars { position: fixed; inset: 0; z-index: -1; background-image:
      radial-gradient(1px 1px at 20% 30%, #fff8 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 15%, #fff6 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 70%, #fff5 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 55%, #fff5 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 85%, #fff5 0%, transparent 100%);
    pointer-events: none; }

  header { padding: 46px 20px 6px; text-align: center; }
  .num { font-size: 3.6rem; font-weight: 800; line-height: 1;
    background: linear-gradient(120deg, var(--gold), #fff2c4 45%, var(--gold2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px rgba(240,201,74,.35)); }
  h1 { font-family: "Playfair Display", serif; margin: 8px 0 6px; font-size: clamp(1.6rem, 4vw, 2.6rem);
    letter-spacing: 4px; color: var(--text); text-shadow: 0 0 30px rgba(240,201,74,.28); }
  header p { color: var(--muted); margin: 0; font-size: .95rem; }

  /* ── Top 5 leaderboard ── */
  .leader { max-width: 1400px; margin: 0 auto; padding: 0 20px 6px; }
  .leader h3 { text-align: center; font-family: "Playfair Display", serif; color: var(--gold);
    letter-spacing: 3px; font-size: 1rem; margin: 26px 0 12px; text-shadow: 0 0 18px rgba(240,201,74,.3); }
  .ranks { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .rank { position: relative; background: linear-gradient(150deg, rgba(240,201,74,.14), rgba(22,28,46,.6));
    border: 1px solid var(--border); border-radius: 16px; padding: 16px 22px 14px; min-width: 200px;
    text-align: center; backdrop-filter: blur(8px); box-shadow: 0 8px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.03) inset; }
  .rank .ico { font-size: 1.6rem; display: block; margin-bottom: 2px; filter: drop-shadow(0 0 10px rgba(240,201,74,.4)); }
  .rank .r { font-size: 1.7rem; font-weight: 800; color: var(--gold); line-height: 1.1; }
  .rank .n { font-size: .98rem; font-weight: 650; font-family: "Playfair Display", serif; }
  .rank .t { font-size: .75rem; color: var(--muted); margin-top: 2px; }

  /* ── filter bar ── */
  .bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    padding: 16px 20px; position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, rgba(7,11,24,.92), rgba(7,11,24,.75)); backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(240,201,74,.15); }
  input[type="search"], select, .bar option {
    background: rgba(22,28,46,.85); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font-size: .98rem; outline: none; }
  input[type="search"] { width: min(420px, 80vw); }
  input[type="search"]:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 12px rgba(240,201,74,.25); }

  /* ── premium dreamy cards ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 22px; padding: 26px 22px 60px; max-width: 1400px; margin: 0 auto; }
  .card { position: relative; overflow: visible; border-radius: 18px; padding: 20px 20px 18px;
    background: linear-gradient(160deg, rgba(255,255,255,.07) 0%, rgba(22,28,46,.55) 45%, rgba(22,28,46,.4) 100%);
    border: 1px solid var(--border); backdrop-filter: blur(10px);
    box-shadow: 0 14px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.04) inset;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: 18px; pointer-events: none;
    background: radial-gradient(220px 120px at 18% 0%, rgba(240,201,74,.16), transparent 70%);
    opacity: .9; }
  .card:hover { transform: translateY(-5px); border-color: rgba(240,201,74,.6);
    box-shadow: 0 22px 55px rgba(0,0,0,.55), 0 0 30px rgba(240,201,74,.18); }
  /* rank badge — upper right corner */
  .rank-corner { position: absolute; top: -12px; right: -8px; width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    font-weight: 800; font-size: .95rem; color: #241a04;
    background: linear-gradient(135deg, #ffe9a8 0%, var(--gold) 45%, var(--gold2) 100%);
    border: 1px solid rgba(255,255,255,.45);
    box-shadow: 0 0 22px rgba(240,201,74,.55), 0 4px 12px rgba(0,0,0,.45); }
  .head { display: flex; align-items: center; gap: 14px; }
  .avatar { flex: 0 0 auto; width: 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 1.9rem;
    background: conic-gradient(from 210deg, rgba(240,201,74,.55), rgba(124,231,210,.45), rgba(59,47,122,.6), rgba(240,201,74,.55));
    border: 1px solid rgba(255,255,255,.25); box-shadow: 0 0 20px rgba(240,201,74,.22); }
  .avatar span { filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
  .card h2 { font-family: "Playfair Display", serif; margin: 0; font-size: 1.18rem; }
  .title { color: var(--accent); font-size: .84rem; margin: 2px 0 0; line-height: 1.35; }
  .summary { color: var(--muted); font-size: .92rem; line-height: 1.55; margin: 14px 0 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: .72rem; padding: 3px 10px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: var(--text); }
  .tag.era { background: rgba(240,201,74,.12); border-color: rgba(240,201,74,.4); color: var(--gold); }
  .tag.status-historical { background: rgba(124,231,210,.1); color: var(--accent); border-color: rgba(124,231,210,.35); }
  .tag.status-active { background: rgba(126,226,168,.1); color: #7ee2a8; border-color: rgba(126,226,168,.35); }
  .tag.status-opposition { background: rgba(242,154,158,.1); color: #f29a9e; border-color: rgba(242,154,158,.35); }
  .tag.party { font-style: italic; color: var(--muted); }
  .count { text-align: center; color: var(--muted); padding: 8px; }
</style>
</head>
<body>
<div class="stars"></div>

<header>
  <div class="num">100</div>
  <h1>POLITICIAN PROFILES</h1>
  <p>Empire builders, presidents, junta leaders, opposition chiefs &amp; student icons — searchable.</p>
</header>

<section class="leader">
  <h3>TOP 5 — GLOBAL POWER SERIAL (ALL REGIONS)</h3>
  <div class="ranks" id="ranks"></div>
</section>

<div class="bar">
  <input id="q" type="search" placeholder="Search name, title, country, summary…" />
  <select id="category">
    <option value="">All profiles</option>
    <option value="top5">⚡ Top 5 Global Power (All Regions)</option>
  </select>
  <select id="region"><option value="">All regions</option></select>
  <select id="status">
    <option value="">All statuses</option>
    <option value="active">Active</option>
    <option value="opposition">Opposition</option>
    <option value="historical">Historical</option>
  </select>
</div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

<script>
const grid = document.getElementById('grid');
const q = document.getElementById('q');
const categorySel = document.getElementById('category');
const regionSel = document.getElementById('region');
const statusSel = document.getElementById('status');
const countEl = document.getElementById('count');
let all = [];

/* unique war crest / icon per politician */
const ICONS = {
  "genghis-khan": "🐎", "alexander-the-great": "⚔️", "julius-caesar": "🦅", "napoleon-bonaparte": "🎖️", "abraham-lincoln": "🎩",
  "vladimir-putin": "🐻", "mikhail-mishustin": "💼", "sergey-lavrov": "🤝", "andrey-belousov": "⚙️", "sergey-sobyanin": "🏙️",
  "dmitry-peskov": "📢", "dmitry-medvedev": "🍏", "vyacheslav-volodin": "🏛️", "gennady-zyuganov": "☭", "valentina-matviyenko": "👑",
  "narendra-modi": "🪷", "yogi-adityanath": "🔱", "j-p-nadda": "🌺", "mallikarjun-kharge": "🐘",
  "benjamin-netanyahu": "🦁", "gadi-eisenkot": "🪖", "naftali-bennett": "🕍", "yair-lapid": "🕯️", "benny-gantz": "🎯",
  "itamar-ben-gvir": "🛡️", "bezalel-smotrich": "💰", "aryeh-deri": "📜", "avigdor-lieberman": "♟️", "yair-golan": "🌈",
  "abdel-fattah-el-sisi": "🏺", "paul-kagame": "🦍", "abiy-ahmed": "✌️", "ibrahima-traore": "✊", "assimi-goita": "🗡️",
  "teodoro-obiang": "🛢️", "yoweri-museveni": "🐄", "isaias-afwerki": "🔒", "julius-malema": "🚩", "emmerson-mnangagwa": "🐊",
  "xi-jinping": "🐉", "li-qiang": "🏗️", "zhao-leji": "📚",
  "mark-carney": "💵", "pierre-poilievre": "🧾",
  "lee-jae-myung": "☮️", "kim-min-seok": "🖇️", "woo-won-shik": "⚖️",
  "kim-jong-un": "💣", "kim-tok-hun": "🏭",
  "donald-trump": "🗽", "mette-frederiksen": "🌟", "friedrich-merz": "🔨", "marine-le-pen": "🐓", "nigel-farage": "🍻",
  "ursula-von-der-leyen": "🌐", "mark-rutte": "⚓", "giorgia-meloni": "🐺", "keir-starmer": "🌹",
  "anthony-albanese": "🦘", "jim-chalmers": "📊", "peter-dutton": "🪃", "penny-wong": "🌏", "mark-butler": "🩺",
  "emmanuel-macron": "⚡", "sebastien-lecornu": "🧩",
  "angela-rayner": "🌻", "rachel-reeves": "🏦", "kemi-badenoch": "🏰",
  "shehbaz-sharif": "🚄", "imran-khan": "🏏", "asif-ali-zardari": "🧠", "bilawal-bhutto-zardari": "🌱",
  "barack-obama": "🖋️", "jd-vance": "📙", "mike-johnson": "⛪", "john-thune": "🚦", "hakeem-jeffries": "🎤",
  "wes-moore": "🦾", "tim-scott": "🧮", "jerome-powell": "📉", "elon-musk": "🚀", "ron-desantis": "🍊",
  "gavin-newsom": "🌴", "alexandria-ocasio-cortez": "🔥",
  "sajith-premadasa": "🎗️", "vijitha-herath": "🧭", "namal-rajapaksa": "💪",
  "tshering-tobgay": "🍃",
  "balendra-shah": "⭐",
  "mohamed-muizzu": "🏖️",
  "min-aung-hlaing": "⛓️", "aung-san-suu-kyi": "🌸",
  "zainul-abedin-farroque": "🪧", "zillur-rahman": "🤲", "shamim-osman": "🎲", "fazlur-rahman": "🗣️",
  "sophie-scholl": "🤍", "wang-dan": "🐋", "john-lewis": "🔗", "abid-al-hasan": "🎓"
};

fetch('politician_profiles.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    all = data.profiles;
    [...new Set(all.map(p => p.region).filter(Boolean))].sort().forEach(rg => {
      const o = document.createElement('option'); o.value = rg; o.textContent = rg; regionSel.append(o);
    });
    const top = all.filter(p => p.global_power_rank).sort((a, b) => a.global_power_rank - b.global_power_rank);
    document.getElementById('ranks').innerHTML = top.map(p =>
      `<div class="rank"><span class="ico">${icon(p)}</span><div class="r">#${p.global_power_rank}</div><div class="n">${esc(p.name)}</div><div class="t">${esc(p.country)}</div></div>`).join('');
    render();
  })
  .catch(e => { countEl.textContent = 'Failed to load politician_profiles.json — ' + e.message; });

function esc(s) { return (s ?? '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function icon(p) { return ICONS[p.id] || '🏛️'; }

function render() {
  const term = q.value.trim().toLowerCase();
  const cat = categorySel.value, reg = regionSel.value, sta = statusSel.value;
  const filtered = all.filter(p =>
    (!cat || (cat === 'top5' && p.global_power_rank)) &&
    (!reg || p.region === reg) &&
    (!sta || p.status === sta) &&
    (!term || [p.name, p.title, p.country, p.region, p.party, p.summary].filter(Boolean).some(v => String(v).toLowerCase().includes(term)))
  );
  countEl.textContent = filtered.length + ' of ' + all.length + ' profiles';
  grid.innerHTML = filtered.map(p => `
    <article class="card">
      ${p.global_power_rank ? `<span class="rank-corner">#${p.global_power_rank}</span>` : ''}
      <div class="head">
        <div class="avatar"><span>${icon(p)}</span></div>
        <div>
          <h2>${esc(p.name)}</h2>
          <p class="title">${esc(p.title)}</p>
        </div>
      </div>
      ${p.era ? `<span class="tag era" style="margin-top:12px">${esc(p.era)}</span>` : ''}
      <p class="summary">${esc(p.summary)}</p>
      <div class="tags">
        <span class="tag status-${esc(p.status)}">${esc(p.status)}</span>
        <span class="tag">${esc(p.country)}</span>
        <span class="tag">${esc(p.region)}</span>
        ${p.party ? `<span class="tag party">${esc(p.party)}</span>` : ''}
      </div>
    </article>`).join('');
}

[q, categorySel, regionSel, statusSel].forEach(el => el.addEventListener('input', render));
</script>
</body>
</html>
